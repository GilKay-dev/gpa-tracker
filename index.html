<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GPA Tracker – Tính điểm trung bình tích lũy</title>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>GPA Tracker</h1>
        <p class="subtitle">Tính điểm trung bình tích lũy hệ 4 và hệ 10</p>
      </header>
      <section class="card">
        <h2>Thêm môn học</h2>
        <form id="course-form" novalidate>
          <div class="field field-name">
            <label for="course-name">Tên môn</label>
            <input id="course-name" name="name" type="text" autocomplete="off"
              placeholder="VD: Giải tích 1" aria-describedby="error-name" />
            <p class="error" id="error-name" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="course-credits">Số tín chỉ</label>
            <input id="course-credits" name="credits" type="text" inputmode="numeric"
              autocomplete="off" placeholder="1–10" aria-describedby="error-credits" />
            <p class="error" id="error-credits" aria-live="polite"></p>
          </div>
          <div class="field">
            <label for="course-score">Điểm hệ 10</label>
            <input id="course-score" name="score" type="text" inputmode="decimal"
              autocomplete="off" placeholder="VD: 8,5" aria-describedby="error-score" />
            <p class="error" id="error-score" aria-live="polite"></p>
          </div>
          <div class="actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">Thêm môn</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Danh sách môn học</h2>
        <div class="table-wrap">
          <table id="course-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Tên môn</th>
                <th class="num">Tín chỉ</th>
                <th class="num">Điểm hệ 10</th>
              </tr>
            </thead>
            <tbody id="course-body"></tbody>
          </table>
        </div>
        <p id="empty-hint" class="hint">Hãy thêm môn học đầu tiên</p>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
